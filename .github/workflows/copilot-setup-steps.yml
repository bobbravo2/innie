name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"

      - name: Upgrade pip and core packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install modern Python development tooling
        run: |
          python -m pip install --upgrade \
            pipx==1.6.0 \
            build==1.2.2 \
            hatchling==1.25.0 \
            pre-commit==4.0.1 \
            pytest==8.3.3 \
            ruff==0.6.9 \
            mypy==1.11.2
